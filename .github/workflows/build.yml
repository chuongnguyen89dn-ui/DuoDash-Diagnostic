name: Build DuoDash Geometry Logger
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install ldid
        run: brew install ldid
      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1 messages=yes
          ls -lah packages
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Geometry-Logger
          path: packages/*.deb
